version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: otto_user
      POSTGRES_PASSWORD: otto_password
      POSTGRES_DB: otto_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otto_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env.production
    environment:
      - APP_ENV=production
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://otto_user:otto_password@db:5432/otto_db
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
    command: python -m queue.worker --num-workers 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

backup-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.backup
    environment:
      - DATABASE_URL=postgresql://otto_user:otto_password@db:5432/otto_db
      - BACKUP_RETENTION_COUNT=7
    volumes:
      - ./backups:/app/backups
    entry: ["python", "-m", "scheduler.backup"]

volumes:
  postgres_data: