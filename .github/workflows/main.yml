name: Build macOS Installer (Otto)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x64
          - os: macos-14
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend (Vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create backend entrypoint (if missing)
        shell: bash
        run: |
          if [ ! -f run_server.py ]; then
            cat > run_server.py <<'PY'
import os
import uvicorn

if __name__ == "__main__":
    host = os.getenv("OTTO_HOST", "127.0.0.1")
    port = int(os.getenv("OTTO_PORT", "8000"))
    uvicorn.run("app.main:app", host=host, port=port)
PY
          fi

      - name: Package Backend (PyInstaller)
        run: |
          pyinstaller --clean --noconfirm --onefile \
            --name otto-backend \
            run_server.py

      - name: Assemble Distribution Folder
        shell: bash
        run: |
          rm -rf dist_bundle
          mkdir -p dist_bundle/backend
          mkdir -p dist_bundle/frontend

          cp -R frontend/dist/* dist_bundle/frontend/
          cp dist/otto-backend dist_bundle/backend/

          # Launcher script for macOS
          cat > dist_bundle/run_otto.command <<'SH'
#!/bin/bash
set -e
DIR="$(cd "$(dirname "$0")" && pwd)"
echo "Starting Otto backend..."
"$DIR/backend/otto-backend" &
BACK_PID=$!
echo "Backend PID: $BACK_PID"

echo "Open Otto UI at: http://127.0.0.1:8000"
echo "Press Ctrl+C in this window to stop."

wait $BACK_PID
SH
          chmod +x dist_bundle/run_otto.command

          # .env example (no secrets)
          cat > dist_bundle/.env.example <<'ENV'
APP_ENV=prod
AUTH_DISABLED=true
COOKIE_SECURE=false
DATABASE_URL=sqlite:///./storage/app.db
STORAGE_ROOT=./storage/contracts
ENV

          # Basic run instructions
          cat > dist_bundle/README_RUN_LOCAL.md <<'MD'
# Otto macOS Package

## Run
1. Unzip the package.
2. Double-click `run_otto.command`.
3. Open: http://127.0.0.1:8000

## Data safety
This package does not include your database by default.
If you want persistence:
- create a `storage/` folder next to `run_otto.command`
- the SQLite DB will live at `storage/app.db`
MD

      - name: Create Zip Artifact
        shell: bash
        run: |
          cd dist_bundle
          zip -r "../otto-macos-${{ matrix.arch }}.zip" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otto-macos-${{ matrix.arch }}
          path: otto-macos-${{ matrix.arch }}.zip
