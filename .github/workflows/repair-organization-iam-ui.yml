name: Repair organization IAM UI

on:
  push:
    branches: [fix/iam-ui-auth-boundary]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch organization settings UI
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/(dashboard)/settings/organization/page.tsx')
          s = p.read_text()

          team_start = s.index('function TeamTab() {')
          permissions_start = s.index('\nfunction PermissionsTab()', team_start)
          team = r'''function TeamTab() {
            const [members, setMembers] = useState<any[]>([]);
            const [loading, setLoading] = useState(true);
            const [inviteEmail, setInviteEmail] = useState("");
            const [inviting, setInviting] = useState(false);
            const [error, setError] = useState("");

            const fetchMembers = async () => {
              setLoading(true);
              setError("");
              try {
                const res = await api.get("/organizations/members");
                const data = res.data;
                setMembers(Array.isArray(data) ? data : Array.isArray(data?.members) ? data.members : []);
              } catch (err: any) {
                setMembers([]);
                setError(err?.response?.data?.error || "Failed to load members");
              } finally {
                setLoading(false);
              }
            };

            useEffect(() => { fetchMembers(); }, []);

            const handleInvite = async (e: React.FormEvent) => {
              e.preventDefault();
              if (!inviteEmail.trim()) return;
              setInviting(true);
              setError("");
              try {
                await api.post("/organizations/members", { email: inviteEmail.trim() });
                setInviteEmail("");
                await fetchMembers();
              } catch (err: any) {
                setError(err?.response?.data?.error || "Failed to invite");
              } finally { setInviting(false); }
            };

            const handleRemove = async (identityId: string) => {
              if (!confirm("Remove this member from the organization?")) return;
              try {
                await api.delete(`/organizations/members?identity_id=${encodeURIComponent(identityId)}`);
                await fetchMembers();
              } catch (err: any) {
                setError(err?.response?.data?.error || "Failed to remove member");
              }
            };

            return (
              <div className="space-y-6">
                <Card title="Invite Member">
                  <form onSubmit={handleInvite} className="flex gap-3 items-end">
                    <div className="flex-1">
                      <label className="text-xs text-text-secondary font-bold block mb-1">Email Address</label>
                      <input className="input w-full" placeholder="colleague@example.com" value={inviteEmail} onChange={e => setInviteEmail(e.target.value)} />
                    </div>
                    <Button variant="primary" size="sm" type="submit" disabled={inviting || !inviteEmail.trim()}>
                      <Plus size={14} /> {inviting ? "Inviting..." : "Invite"}
                    </Button>
                  </form>
                  {error && <p className="text-xs text-danger mt-2">{error}</p>}
                </Card>

                <Card title={`Team Members (${members.length})`}>
                  {loading ? (
                    <div className="p-8 text-center text-text-secondary">Loading...</div>
                  ) : members.length === 0 ? (
                    <p className="text-sm text-text-secondary">No members yet.</p>
                  ) : (
                    <div className="overflow-x-auto -mx-6 -mb-6">
                      <table className="w-full" style={{ borderCollapse: "collapse" }}>
                        <thead>
                          <tr className="text-left text-xs uppercase tracking-wider text-text-secondary border-b border-white/5">
                            <th className="p-4 font-bold">User</th>
                            <th className="p-4 font-bold">Email</th>
                            <th className="p-4 font-bold">Role</th>
                            <th className="p-4 font-bold">Status</th>
                            <th className="p-4 font-bold">Joined</th>
                            <th className="p-4 font-bold"></th>
                          </tr>
                        </thead>
                        <tbody>
                          {members.map((m) => (
                            <tr key={m.id} className="border-b border-white/5 hover:bg-white/5 transition-colors">
                              <td className="p-4 text-sm text-white font-medium">{m.displayName || m.name || m.email || m.identityId || "—"}{m.isOwner ? " · Owner" : ""}</td>
                              <td className="p-4 text-sm text-text-secondary">{m.email || "—"}</td>
                              <td className="p-4"><Badge variant="primary" size="sm">{m.roleName || m.roleKey || "—"}</Badge></td>
                              <td className="p-4">
                                <span className={`inline-flex items-center font-bold rounded-full px-2 py-0.5 text-[10px] uppercase tracking-wider ${m.status === "active" || m.is_active ? "bg-success/10 text-success border border-success/30" : "bg-danger/10 text-danger border border-danger/30"}`}>
                                  {m.status === "active" || m.is_active ? "Active" : "Inactive"}
                                </span>
                              </td>
                              <td className="p-4 text-sm text-text-secondary">{m.joinedAt || m.accepted_at ? new Date(m.joinedAt || m.accepted_at).toLocaleDateString() : "—"}</td>
                              <td className="p-4">
                                {!m.isOwner && <button onClick={() => handleRemove(m.identityId || m.user_id)} className="text-danger hover:bg-danger/10 p-1 rounded transition-all"><Trash2 size={14} /></button>}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </Card>
              </div>
            );
          }
          '''
          s = s[:team_start] + team + s[permissions_start:]

          roles_start = s.index('function RolesTab() {')
          permissions_start = s.index('\nfunction PermissionsTab()', roles_start)
          roles = r'''function RolesTab() {
            const [roles, setRoles] = useState<any[]>([]);
            const [loading, setLoading] = useState(true);
            const [newName, setNewName] = useState("");
            const [newDesc, setNewDesc] = useState("");
            const [creating, setCreating] = useState(false);
            const [error, setError] = useState("");

            const fetchRoles = async () => {
              setLoading(true);
              setError("");
              try {
                const res = await api.get("/auth/organizations/roles");
                const data = res.data;
                setRoles(Array.isArray(data) ? data : Array.isArray(data?.roles) ? data.roles : []);
              } catch (err: any) {
                setRoles([]);
                setError(err?.response?.data?.error || "Failed to load roles");
              } finally {
                setLoading(false);
              }
            };

            useEffect(() => { fetchRoles(); }, []);

            const handleCreate = async (e: React.FormEvent) => {
              e.preventDefault();
              if (!newName.trim()) return;
              setCreating(true);
              setError("");
              try {
                await api.post("/auth/organizations/roles", { name: newName.trim(), description: newDesc.trim() || undefined });
                setNewName("");
                setNewDesc("");
                await fetchRoles();
              } catch (err: any) {
                setError(err?.response?.data?.error || "Failed to create role");
              } finally { setCreating(false); }
            };

            if (loading) return <div className="p-8 text-center text-text-secondary">Loading...</div>;

            return (
              <div className="space-y-6">
                <Card title="Create Role">
                  <form onSubmit={handleCreate} className="space-y-3">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs text-text-secondary font-bold block mb-1">Role Name *</label>
                        <input className="input w-full" value={newName} onChange={e => setNewName(e.target.value)} placeholder="e.g. Marketing Manager" />
                      </div>
                      <div>
                        <label className="text-xs text-text-secondary font-bold block mb-1">Description</label>
                        <input className="input w-full" value={newDesc} onChange={e => setNewDesc(e.target.value)} placeholder="Role description" />
                      </div>
                    </div>
                    {error && <p className="text-xs text-danger">{error}</p>}
                    <Button variant="primary" size="sm" type="submit" disabled={creating || !newName.trim()}>{creating ? "Creating..." : "Create Role"}</Button>
                  </form>
                </Card>

                <Card title={`Roles (${roles.length})`}>
                  {roles.length === 0 ? (
                    <p className="text-sm text-text-secondary">No roles defined yet.</p>
                  ) : (
                    <div className="space-y-2">
                      {roles.map((role) => (
                        <div key={role.id} className="flex items-center justify-between p-3 bg-surface-elevated rounded-lg">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="text-sm font-medium text-white">{role.name}</span>
                              {(role.isSystem || role.is_system) && <Badge variant="neutral" size="sm">System</Badge>}
                            </div>
                            {role.description && <p className="text-xs text-text-secondary mt-0.5">{role.description}</p>}
                            <p className="text-xs text-text-secondary mt-1">{role.memberCount ?? 0} members · {role.permissionCount ?? role._count?.role_permissions ?? 0} permissions</p>
                          </div>
                          <Badge variant="primary" size="sm">{role.permissionCount ?? role._count?.role_permissions ?? 0} permissions</Badge>
                        </div>
                      ))}
                    </div>
                  )}
                </Card>
              </div>
            );
          }
          '''
          s = s[:roles_start] + roles + s[permissions_start:]
          p.write_text(s)

      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/(dashboard)/settings/organization/page.tsx"
          git rm .github/workflows/repair-organization-iam-ui.yml
          git commit -m "fix(ui): align organization tabs with IAM API contracts"
          git push
