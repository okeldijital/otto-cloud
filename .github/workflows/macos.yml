name: Build macOS Otto (zip)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x64
          - os: macos-14
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller uvicorn

      - name: Create Backend Entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("run_server.py")
          if not p.exists():
              p.write_text(
                  "import os\n"
                  "import uvicorn\n\n"
                  "if __name__ == '__main__':\n"
                  "    host = os.getenv('OTTO_HOST', '127.0.0.1')\n"
                  "    port = int(os.getenv('OTTO_PORT', '8000'))\n"
                  "    uvicorn.run('app.main:app', host=host, port=port)\n"
              )
          print("run_server.py ready")
          PY

      - name: Package Backend (PyInstaller)
        run: |
          PYTHONPATH="$(pwd)" pyinstaller --clean --noconfirm --onefile --name otto-backend run_server.py

      - name: Assemble Bundle
        run: |
          rm -rf dist_bundle
          mkdir -p dist_bundle/backend
          mkdir -p dist_bundle/frontend

          cp -R frontend/dist/* dist_bundle/frontend/
          cp dist/otto-backend dist_bundle/backend/

          cat > dist_bundle/run_otto.command <<'SH'
          #!/bin/bash
          set -e
          DIR="$(cd "$(dirname "$0")" && pwd)"
          echo "Starting Otto backend..."
          "$DIR/backend/otto-backend" &
          echo "Open Otto UI at: http://127.0.0.1:8000"
          wait
          SH
          chmod +x dist_bundle/run_otto.command

          cat > dist_bundle/.env.example <<'ENV'
          APP_ENV=prod
          AUTH_DISABLED=true
          COOKIE_SECURE=false
          DATABASE_URL=sqlite:///./storage/app.db
          STORAGE_ROOT=./storage/contracts
          ENV

          cat > dist_bundle/README_RUN_LOCAL.md <<'MD'
          # Otto macOS Package

          ## Run
          1) Unzip
          2) Double-click `run_otto.command`
          3) Open http://127.0.0.1:8000

          ## Database safety
          Create a `storage/` folder next to `run_otto.command`.
          Your DB will live at `storage/app.db` and persists across updates.
          MD

      - name: Zip Artifact
        run: |
          cd dist_bundle
          zip -r "../otto-macos-${{ matrix.arch }}.zip" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otto-macos-${{ matrix.arch }}
          path: otto-macos-${{ matrix.arch }}.zip
